version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
#      # Wolumen potrzebny, abyś nie tracił dashboardów po restarcie kontenera
##      - grafana_data:/var/lib/grafana
#      # Mapowanie pliku konfiguracyjnego provisioningu
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      # Mapowanie katalogu z plikami JSON
      - ./config/grafana/dashboards-json:/var/lib/grafana/dashboards
      # Mapowanie konfiguracji źródeł danych:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: always